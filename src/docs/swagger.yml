components:
  schemas:
    MenuItemRequestDto:
      required:
        - description
        - name
        - price
        - restaurantId
        - type
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        price:
          minimum: 0.01
          exclusiveMinimum: false
          type: number
        type:
          type: string
          enum:
            - VEGETARIAN
            - NONVEGETARIAN
            - VEGAN
        restaurantId:
          type: integer
          format: int64
    MenuItemResponseDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        price:
          type: number
        type:
          type: string
          enum:
            - VEGETARIAN
            - NONVEGETARIAN
            - VEGAN
        restaurantId:
          type: integer
          format: int64
        restaurantName:
          type: string
    UserRequestDto:
      required:
        - address
        - password
        - phoneNumber
        - role
        - username
      type: object
      properties:
        username:
          maxLength: 50
          minLength: 2
          type: string
        email:
          type: string
        password:
          type: string
        address:
          type: string
        phoneNumber:
          type: string
        role:
          type: string
          enum:
            - USER
            - ADMIN
            - DELIVERY
            - OWNER
    UserResponseDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
        address:
          type: string
        phoneNumber:
          pattern: "^\\+?[0-9\\s-]{10,}$"
          type: string
        role:
          type: string
          enum:
            - USER
            - ADMIN
            - DELIVERY
            - OWNER
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    LocalTime:
      type: object
      properties:
        hour:
          type: integer
          format: int32
        minute:
          type: integer
          format: int32
        second:
          type: integer
          format: int32
        nano:
          type: integer
          format: int32
    RestaurantRequestDto:
      required:
        - address
        - latitude
        - location
        - longitude
        - name
        - phoneNumber
        - rating
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        location:
          type: string
        latitude:
          maximum: 90.0
          exclusiveMaximum: false
          minimum: -90.0
          exclusiveMinimum: false
          type: number
          format: double
        longitude:
          maximum: 180.0
          exclusiveMaximum: false
          minimum: -180.0
          exclusiveMinimum: false
          type: number
          format: double
        phoneNumber:
          maxLength: 10
          minLength: 10
          type: string
        email:
          type: string
        rating:
